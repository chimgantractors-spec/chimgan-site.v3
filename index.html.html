*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font:17px/1.65 Onest,"Segoe UI",Roboto,system-ui,sans-serif;color:var(--t);background:#fff}
@view-transition{navigation:auto}

.alt{background:var(--pl)}

header{position:sticky;top:0;z-index:9;background:#fffd;backdrop-filter:blur(12px);border-bottom:1px solid var(--l)}
.nav{display:flex;align-items:center;gap:28px;min-height:68px;flex-wrap:wrap}
.logo{font:700 1.25rem var(--d);color:var(--o)}
nav{display:flex;gap:24px;margin-left:auto;font-size:.95rem}
nav a{border-bottom:2px solid transparent;transition:.2s}
nav a:hover{border-color:var(--o)}
.tel{font-weight:600}
.hero{padding:clamp(72px,12vw,160px) 0;background:var(--pl)}
.hero h1{font-size:clamp(2rem,5.4vw,4rem);max-width:15ch}
.hero p{max-width:520px;margin:0 0 36px;color:var(--m);font-size:1.15rem}
.hero .w>*{animation:up .8s both}
.hero .w>:nth-child(2){animation-delay:.12s}
.hero .w>:nth-child(n+3){animation-delay:.24s}
@keyframes up{from{opacity:0;transform:translateY(24px)}}
.btn{display:inline-block;padding:14px 28px;border:2px solid var(--o);border-radius:99px;font:600 1rem Onest,sans-serif;cursor:pointer;transition:.25s}
.btn+.btn{margin-left:12px}
.o{background:var(--o);color:var(--t)}
.o:hover{background:var(--oh);border-color:var(--oh)}
.l{background:none;color:var(--t)}
.l:hover{background:var(--p)}
.s{padding:6px 14px;font-size:.9rem}
.facts{display:flex;flex-wrap:wrap;gap:12px 40px;padding-top:32px;padding-bottom:32px;color:var(--m)}
.facts b{font:700 1.1rem var(--d);color:var(--t);margin-right:4px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,72px)}
.cols4{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:32px}
.cols4>div,blockquote{border-top:3px solid var(--o);padding-top:18px}
blockquote cite{display:block;margin-top:12px;font-style:normal;font-size:.9rem;color:var(--m)}
.top{align-items:start}
.card{display:block;border:1px solid var(--l);border-radius:20px;overflow:hidden;background:#fff}
.card:hover{translate:0 -6px;box-shadow:0 20px 44px #ff6a0026;border-color:var(--p)}
.im{aspect-ratio:4/3;background:var(--p);overflow:hidden}
.im img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.card:hover .im img{transform:scale(1.05)}
.ph{display:grid;place-items:center;color:var(--od);font:700 1.3rem var(--d)}
.bd{padding:20px}
.bd p{color:var(--m)}
.bd b{display:block;margin-top:12px;font:700 .95rem var(--d);color:var(--od)}
.band{display:flex;justify-content:space-between;align-items:center;gap:32px;flex-wrap:wrap;padding:clamp(28px,5vw,56px);background:var(--p);border-radius:28px}
.band h2{margin-bottom:12px}
.main{width:100%;aspect-ratio:4/3;border-radius:18px;object-fit:cover}
.th{display:flex;gap:10px;margin-top:10px}
.th img{width:84px;height:64px;object-fit:cover;border-radius:10px;cursor:pointer}
.price{font:700 1.6rem var(--d);color:var(--od);margin:12px 0 24px}
table{width:100%;border-collapse:collapse;margin-top:28px}
th,td{padding:11px 8px;border-bottom:1px solid var(--l);text-align:left;vertical-align:top}
th{color:var(--m);font-weight:500;width:42%}
ul,ol{padding-left:22px}
li{margin-bottom:6px}
details{border-bottom:1px solid var(--l);padding:16px 0}
summary{cursor:pointer;font-weight:600}
details p{margin-top:10px;color:var(--m)}
.form,.calc{display:grid;gap:16px}
label{display:grid;gap:6px;font-size:.9rem;color:var(--m)}
input,select,textarea{width:100%;font:inherit;color:var(--t);padding:12px 14px;border:1.5px solid var(--l);border-radius:12px;background:#fff;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--o);box-shadow:0 0 0 3px #ff6a0033}
input[type=range]{padding:0;border:0;accent-color:var(--o)}
input[type=checkbox]{width:auto}
.hp{position:absolute;left:-9999px}
.ok{padding:14px 18px;background:var(--p);border-radius:12px;margin-bottom:16px}
.er{color:#B00020}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;align-items:end}
.filters span{display:flex;gap:8px}
.cnt{margin:24px 0}
.res{display:grid;gap:14px;padding:24px;background:var(--pl);border-radius:18px;color:var(--m)}
.res b{display:block;font:700 1.35rem var(--d);color:var(--t)}
.map{width:100%;min-height:340px;border:0;border-radius:18px}
footer{border-top:1px solid var(--l);padding:40px 0;color:var(--m)}
footer .w{display:flex;flex-wrap:wrap;gap:12px 32px}
footer b{color:var(--t)}
.narrow{max-width:420px}
.an{display:flex;flex-wrap:wrap;gap:8px 24px;padding-bottom:20px;margin-bottom:28px;border-bottom:1px solid var(--l)}
.an span{margin-left:auto}
.adm .sec{padding-top:32px}
.ac{white-space:nowrap}
.ac>*{display:inline-block;margin-right:6px}
.inl{display:inline}
.phl{display:flex;flex-wrap:wrap;gap:14px;margin:12px 0}
.phl label{width:130px}
.phl img{height:90px;width:100%;object-fit:cover;border-radius:8px}
.rv{transition:opacity .6s,transform .6s,translate .3s,box-shadow .3s,border-color .3s}

:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

header{top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#fffd;backdrop-filter:blur(12px)}
.ph svg{width:58%;color:var(--o)}

.lang{display:flex;gap:6px}.lang a{padding:5px 11px;border:1.5px solid var(--l);border-radius:99px;font:600 .8rem Onest,sans-serif;color:var(--m);transition:.2s}.lang a:hover{border-color:var(--o);color:var(--t)}.lang a.on{background:var(--o);border-color:var(--o);color:var(--t)}
